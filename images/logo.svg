<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BC4F6"/>
      <stop offset="100%" style="stop-color:#1A8FE3"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A8FE3"/>
      <stop offset="100%" style="stop-color:#0D6EBF"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3BB0F0"/>
      <stop offset="100%" style="stop-color:#1578D4"/>
    </linearGradient>
  </defs>
  <!-- 左面 -->
  <polygon points="10,35 60,5 60,60 10,90" fill="url(#g1)"/>
  <!-- 右面 -->
